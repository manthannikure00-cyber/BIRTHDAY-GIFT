
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 2;
      animation: pop 0.8s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.5);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .cake {
      font-size: 75px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      margin: 15px 0 10px;
      font-size: 34px;
      color: #ff4081;
    }

    h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 25px;
    }

    p {
      color: #555;
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 13px 25px;
      border: none;
      border-radius: 30px;
      background: #ff4081;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      background: #e91e63;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 1;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }

      .cake {
        font-size: 65px;
      }

      h1 {
        font-size: 29px;
      }

      h2 {
        font-size: 22px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="cake">🎂</div>

    <h1>Happy Birthday! 🎉</h1>

    <h2>Dear FHIPULII ❤️</h2>

    <p>
      Wishing you a very Happy Birthday! 🥳<br>
      May your day be filled with happiness,
      laughter and lots of beautiful memories. ✨
    </p>

    <button onclick="celebrate()">🎊 Celebrate 🎊</button>
  </div>

  <script>
    function createConfetti() {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor =
        `hsl(${Math.random() * 360}, 100%, 60%)`;

      confetti.style.animationDuration =
        (Math.random() * 3 + 2) + "s";

      confetti.style.transform =
        `rotate(${Math.random() * 360}deg)`;

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 5000);
    }

    function celebrate() {
      for (let i = 0; i < 100; i++) {
        setTimeout(createConfetti, i * 20);
      }
    }

    // Start confetti automatically
    for (let i = 0; i < 60; i++) {
      setTimeout(createConfetti, i * 50);
    }
  </script>

</body>
</html>
